###############################################################################
# GitHub Actions Workflow – CC Destroy
#
# Shared teardown for all 3 CC deploy workflows (cc-phase1-deploy.yml,
# cc-deploy-only.yml, cc-fabric-deployment.yml). They all read/write the same
# cc-terraform-state git branch against the same live Catalyst Center
# controller, so destroying is a single shared operation regardless of which
# workflow most recently touched the state.
#
# Requires typing "destroy" into the confirm input - this tears down live
# Catalyst Center config and cannot be undone.
###############################################################################

name: CC Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm you want to tear down the live Catalyst Center config'
        required: true

concurrency:
  group: cc-deploy-only
  cancel-in-progress: false

defaults:
  run:
    working-directory: catalystcenter

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan-destroy:
    name: Plan Destroy
    runs-on: ubuntu-latest
    container:
      image: danischm/nac:0.4.0
      options: --user root --cap-add=NET_ADMIN --device=/dev/net/tun
    timeout-minutes: 30
    environment: ntt-workshop-lab
    permissions:
      contents: write
    env:
      CC_PASSWORD: ${{ secrets.CC_PASSWORD }}
      CC_VPN_USERNAME: ${{ secrets.CC_VPN_USERNAME }}
      CC_VPN_PASSWORD: ${{ secrets.CC_VPN_PASSWORD }}
    steps:
      - name: Confirm destroy intent
        working-directory: .
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "::error::Confirmation input must be exactly 'destroy' to proceed"; exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Mark repository as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install VPN client
        run: |
          apt-get update && apt-get install -y openconnect || apk add --no-cache openconnect

      - name: Restore Terraform state
        uses: ./.github/actions/tf-state-restore

      - name: Terraform init
        run: terraform init -input=false

      - name: Connect to dCloud VPN
        run: |
          cp /etc/resolv.conf /tmp/resolv.conf.bak
          echo "$CC_VPN_PASSWORD" | openconnect --background --pid-file=/tmp/openconnect.pid \
            --user="$CC_VPN_USERNAME" --passwd-on-stdin --protocol=anyconnect \
            dcloud-sjc-anyconnect.cisco.com
          sleep 5

      - name: Verify Catalyst Center reachability
        run: |
          curl -sk --max-time 10 -o /dev/null https://198.18.129.100 || {
            echo "::error::Cannot reach 198.18.129.100 through the VPN tunnel"; exit 1; }

      - name: Terraform destroy plan
        run: |
          terraform plan -destroy -parallelism=1 -out=destroy.tfplan -input=false
          terraform show -no-color destroy.tfplan > destroy.txt
          terraform show -json destroy.tfplan | jq > destroy.json

      - name: Disconnect VPN
        if: always()
        run: |
          kill "$(cat /tmp/openconnect.pid)" 2>/dev/null || true
          sleep 15
          cp /tmp/resolv.conf.bak /etc/resolv.conf 2>/dev/null || true

      - name: Upload destroy plan artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cc-destroy-plan-outputs
          path: |
            catalystcenter/destroy.tfplan
            catalystcenter/destroy.txt
            catalystcenter/destroy.json
          retention-days: 7

  destroy:
    name: Destroy
    needs: [plan-destroy]
    runs-on: ubuntu-latest
    container:
      image: danischm/nac:0.4.0
      options: --user root --cap-add=NET_ADMIN --device=/dev/net/tun
    timeout-minutes: 60
    environment: ntt-workshop-lab
    permissions:
      contents: write
    env:
      CC_PASSWORD: ${{ secrets.CC_PASSWORD }}
      CC_VPN_USERNAME: ${{ secrets.CC_VPN_USERNAME }}
      CC_VPN_PASSWORD: ${{ secrets.CC_VPN_PASSWORD }}
    steps:
      - name: Confirm destroy intent
        working-directory: .
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "::error::Confirmation input must be exactly 'destroy' to proceed"; exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Mark repository as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install VPN client
        run: |
          apt-get update && apt-get install -y openconnect || apk add --no-cache openconnect

      - name: Download destroy plan
        uses: actions/download-artifact@v5
        with:
          name: cc-destroy-plan-outputs
          path: catalystcenter

      - name: Restore Terraform state
        uses: ./.github/actions/tf-state-restore

      - name: Terraform init
        run: terraform init -input=false

      - name: Connect to dCloud VPN
        run: |
          cp /etc/resolv.conf /tmp/resolv.conf.bak
          echo "$CC_VPN_PASSWORD" | openconnect --background --pid-file=/tmp/openconnect.pid \
            --user="$CC_VPN_USERNAME" --passwd-on-stdin --protocol=anyconnect \
            dcloud-sjc-anyconnect.cisco.com
          sleep 5

      - name: Verify Catalyst Center reachability
        run: |
          curl -sk --max-time 10 -o /dev/null https://198.18.129.100 || {
            echo "::error::Cannot reach 198.18.129.100 through the VPN tunnel"; exit 1; }

      - name: Terraform apply destroy plan
        run: terraform apply -parallelism=1 -input=false -auto-approve destroy.tfplan

      - name: Disconnect VPN
        if: always()
        run: |
          kill "$(cat /tmp/openconnect.pid)" 2>/dev/null || true
          sleep 15
          cp /tmp/resolv.conf.bak /etc/resolv.conf 2>/dev/null || true

      - name: Save Terraform state
        if: always()
        uses: ./.github/actions/tf-state-save
