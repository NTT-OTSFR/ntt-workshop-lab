name: Reset Terraform State

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which Terraform state should be reset?
        required: true
        default: all
        type: choice
        options:
          - all
          - meraki
          - catalystcenter
      confirm:
        description: Type reset to clear the selected Terraform state. This does not delete live infrastructure.
        required: true
        type: string

concurrency:
  group: reset-terraform-state-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  reset-state:
    name: Reset selected Terraform state
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "reset" ]; then
            echo "::error::To reset Terraform state, set confirm to reset."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Mark repository as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create empty Terraform state files
        run: |
          set -e

          create_empty_state() {
            state_dir="$1"
            mkdir -p "$state_dir"
            lineage="$(uuidgen)"
            cat > "$state_dir/terraform.tfstate" <<EOF
          {
            "version": 4,
            "terraform_version": "1.6.6",
            "serial": 1,
            "lineage": "$lineage",
            "outputs": {},
            "resources": [],
            "check_results": null
          }
          EOF
            cp "$state_dir/terraform.tfstate" "$state_dir/terraform.tfstate.backup"
          }

          case "${{ github.event.inputs.target }}" in
            all)
              create_empty_state meraki
              create_empty_state catalystcenter
              ;;
            meraki)
              create_empty_state meraki
              ;;
            catalystcenter)
              create_empty_state catalystcenter
              ;;
            *)
              echo "::error::Unknown target: ${{ github.event.inputs.target }}"
              exit 1
              ;;
          esac

      - name: Delete existing Meraki state caches
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'meraki' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          deleted=0

          while true; do
            response="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/caches?key=terraform-state-meraki-&per_page=100")"
            ids="$(echo "$response" | jq -r '.actions_caches[].id')"

            if [ -z "$ids" ]; then
              break
            fi

            for cache_id in $ids; do
              curl -fsSL -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
              deleted=$((deleted + 1))
            done
          done

          echo "Deleted ${deleted} Meraki Terraform state cache entr$( [ "$deleted" -eq 1 ] && echo y || echo ies )."

      - name: Save empty Meraki state cache
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'meraki' }}
        uses: actions/cache/save@v4
        with:
          path: |
            meraki/terraform.tfstate
            meraki/terraform.tfstate.backup
          key: terraform-state-meraki-${{ github.ref_name }}-${{ github.run_id }}-reset

      - name: Save empty Catalyst Center state
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'catalystcenter' }}
        uses: ./.github/actions/tf-state-save

      - name: Upload reset state artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reset-terraform-state-${{ github.event.inputs.target }}-${{ github.run_number }}
          path: |
            meraki/terraform.tfstate
            meraki/terraform.tfstate.backup
            catalystcenter/terraform.tfstate
            catalystcenter/terraform.tfstate.backup
          retention-days: 30
          if-no-files-found: ignore